<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KETICK OS | Next-Gen ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        /* Fullscreen Module Mode */
        .is-fullscreen header, .is-fullscreen #dashboard-view, .is-fullscreen .mobile-nav { display: none !important; }
        .is-fullscreen #app-frame { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; z-index: 40; background: #020617; }
        .is-fullscreen #floating-back { display: flex; }

        /* Security Overlay */
        #security-overlay { position: fixed; inset: 0; z-index: 9999; background: #020617; display: flex; align-items: center; justify-content: center; transition: 0.5s; }
        .pin-input { width: 60px; height: 75px; text-align: center; font-size: 28px; font-weight: 800; border-radius: 20px; background: rgba(255, 255, 255, 0.03); border: 2px solid rgba(255, 255, 255, 0.05); color: white; outline: none; transition: 0.3s; }
        .pin-input:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); }

        /* Navigation */
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; color: #475569; transition: 0.3s; }
        .nav-btn.active { color: #3b82f6; }
        .nav-btn span { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        
        #floating-back { position: fixed; top: 20px; left: 20px; z-index: 100; width: 45px; height: 45px; background: #3b82f6; border-radius: 15px; display: none; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .animate-slide-up { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body id="master-body" class="p-5 md:p-10">

    <div id="emergency-overlay" class="fixed inset-0 z-[10000] bg-red-950/95 backdrop-blur-xl hidden flex-col items-center justify-center text-center p-10">
        <div class="w-40 h-40 bg-red-600 rounded-full flex items-center justify-center animate-ping absolute opacity-10"></div>
        <i class="fas fa-shield-virus text-8xl text-red-500 mb-6 animate-pulse"></i>
        <h1 class="text-4xl font-black text-white uppercase tracking-tighter">Protokol Keselamatan</h1>
        <p class="text-red-400 font-bold uppercase tracking-[0.3em] mb-10 text-[10px]">Aktiviti Mencurigakan Dikesan</p>
        <div class="glass p-8 rounded-[3rem] border-red-500/20 mb-10 min-w-[320px]">
            <p id="alert-staf" class="text-xl font-black text-white">--</p>
            <p class="text-[9px] text-red-500 font-black uppercase mt-2">Menjejak Lokasi Kakitangan...</p>
        </div>
        <button onclick="location.reload()" class="bg-white text-black px-10 py-4 rounded-2xl font-black uppercase text-xs shadow-xl">Sahkan Identiti Pemilik</button>
    </div>

    <button id="floating-back" onclick="loadModule('dashboard')" class="active:scale-90 transition">
        <i class="fas fa-home text-white"></i>
    </button>

    <div id="security-overlay">
        <div class="max-w-sm w-full p-10 rounded-[3.5rem] glass text-center border border-white/10 shadow-2xl animate-slide-up">
            <div class="w-20 h-20 bg-blue-600/10 rounded-[2rem] flex items-center justify-center mx-auto mb-6 border border-blue-500/20">
                <i class="fas fa-fingerprint text-blue-500 text-3xl"></i>
